name: Gunluk tiktok paketi

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  paket:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Video paketi uret
        run: python3 tiktok_paket.py
      - name: Depoya isle
        run: |
          git config user.name "filmarsivi-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --quiet --cached || git commit -m "Otomatik: gunun tiktok paketi"
          git push
